# Keep the existing workflow and check names for repository status-check consumers.
name: Format Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Check code formatting
    # Public repo: largest standard free tier (4 vCPU, 16 GB RAM, 14 GB SSD).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock
            .github/workflows/format-check.yml

      - name: Install project Python
        run: uv python install

      # The unittest suite invokes Node; explicitly install it so JS checks cannot skip.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # --locked also rejects stale metadata; --frozen alone would not check it.
      - name: Install locked project dependencies
        run: uv sync --locked

      - name: Check formatting and imports
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .

      - name: Python and JavaScript regression tests
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Check browser JavaScript syntax
        run: node --check web/app.js
