[project]
name = "paper-reader"
version = "0.1.0"
description = "Personal local reader for conference/journal papers with AI summary, translation, side-by-side view, and Q&A, powered by the Claude Code CLI under your subscription."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "pysbd>=0.3.4",
]

[tool.ruff]
line-length = 100

[tool.uv]
package = false
