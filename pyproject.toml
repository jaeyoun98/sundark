[project]
name = "paper-reader"
version = "0.1.0"
description = "Personal local reader for conference/journal papers with AI summary, translation, side-by-side view, and Q&A, powered by the Claude Code CLI under your subscription."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "pysbd>=0.3.4",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
package = false
